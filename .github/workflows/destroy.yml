name: destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-target
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Required variable; its value doesn't affect a destroy plan.
  TF_VAR_source_public_ip: "203.0.113.10"

jobs:
  destroy:
    runs-on: ubuntu-24.04
    environment: aws-target
    defaults:
      run:
        working-directory: envs/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GHA_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - name: init
        run: terraform init

      - name: plan
        run: terraform plan -destroy -no-color -out=tfplan

      - name: apply
        run: terraform apply -no-color tfplan
