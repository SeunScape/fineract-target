name: plan

on:
  pull_request:
    paths:
      - "envs/target/**"
      - ".github/workflows/plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-target
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_enable_vpn: "true"
  TF_VAR_enable_rds: "true"
  # Dummy (TEST-NET-3) address; plan only.
  TF_VAR_source_public_ip: "203.0.113.10"

jobs:
  plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: envs/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GHA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init

      - name: validate
        run: terraform validate -no-color

      - name: plan
        run: terraform plan -no-color -out=tfplan

      - name: summary
        run: |
          {
            echo "### Terraform plan: \`envs/target\`"
            echo
            terraform show -no-color tfplan | grep -E '^(Plan:|No changes\.)' || true
            echo
            echo '```'
            terraform show -json tfplan \
              | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) | "\(.change.actions | join("/"))  \(.address)"'
            echo '```'
            echo
            echo "Commit \`${GITHUB_SHA::7}\`, run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } > plan-summary.md

      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file plan-summary.md --edit-last --create-if-none
