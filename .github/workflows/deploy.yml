name: deploy

on:
  workflow_dispatch:
    inputs:
      enable_vpn:
        description: Create the Site-to-Site VPN
        type: boolean
        default: false
      enable_rds:
        description: Create RDS for PostgreSQL
        type: boolean
        default: false
      multi_az:
        description: RDS Multi-AZ
        type: boolean
        default: false
      source_public_ip:
        description: Droplet public IPv4 (VPN customer gateway)
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-target
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_enable_vpn: ${{ inputs.enable_vpn }}
  TF_VAR_enable_rds: ${{ inputs.enable_rds }}
  TF_VAR_multi_az: ${{ inputs.multi_az }}
  TF_VAR_source_public_ip: ${{ inputs.source_public_ip }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: aws-target
    defaults:
      run:
        working-directory: envs/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GHA_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - name: init
        run: terraform init

      - name: plan
        run: terraform plan -no-color -out=tfplan

      - name: apply
        run: terraform apply -no-color tfplan
